name: Cloud Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        # BrowserRouter-only SPA; the remaining advisory is limited to server/RSC actions.
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-test-key
      - name: Validate serverless proxy syntax
        run: node --check api/anedya.js
