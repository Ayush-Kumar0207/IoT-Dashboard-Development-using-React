name: Refresh Cloud Dependency Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependencies
        run: npm audit fix
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-cloud-dependencies
          path: |
            package.json
            package-lock.json
