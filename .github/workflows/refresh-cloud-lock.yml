name: Refresh Cloud Dependency Lock

on:
  push:
    branches: [agent/cloud-security-ci]
    paths:
      - .github/workflows/refresh-cloud-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-security-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Refresh cloud dependency lockfile"
          git push
